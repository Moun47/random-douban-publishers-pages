<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机豆瓣出版社页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }
        
        .info-item {
            margin-bottom: 10px;
        }
        
        .info-label {
            font-weight: bold;
            color: #333;
        }
        
        .info-value {
            color: #666;
            margin-left: 10px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            margin-left: 15px;
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4);
        }
        
        .btn-secondary:hover {
            box-shadow: 0 8px 20px rgba(108, 117, 125, 0.6);
        }
        
        .stats {
            margin-top: 30px;
            color: #666;
            font-size: 14px;
        }
        
        .loading {
            color: #666;
            font-style: italic;
        }

        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close:hover,
        .close:focus {
            color: #333;
            text-decoration: none;
        }

        .modal-content h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .modal-content h3 {
            color: #555;
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .modal-content p {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>随机豆瓣出版社页面</h1>
        <p>点击按钮，随机访问豆瓣上出版社的图书页面</p>
        
        <div style="margin: 20px 0; padding: 20px; background: #f8f9fa; border-radius: 8px;">
            <h3 style="margin-bottom: 15px; color: #333; font-size: 16px;">🎯 随机范围设置</h3>
            <div style="margin-bottom: 10px;">
                <label for="rangeSlider" style="display: block; margin-bottom: 8px; color: #666; font-size: 14px;">
                    限制在出版社前 <span id="rangeValue">100</span>% 的页数中随机
                </label>
                <input type="range" id="rangeSlider" min="1" max="100" value="100" step="1" 
                       oninput="updateRangeValue(this)" 
                       style="width: 100%; height: 8px; border-radius: 5px; background: #ddd; outline: none; -webkit-appearance: none;">
                <div style="display: flex; justify-content: space-between; margin-top: 5px; color: #999; font-size: 12px;">
                    <span>1%</span>
                    <span>100%</span>
                </div>
            </div>
        </div>

        <button class="btn" onclick="generateRandomPage()">
            📚 随机访问
        </button>
        <div class="stats">
            <p id="stats">正在加载数据...</p>
        </div>
    </div>

    <script>
        let publishers = {};
        let publisherIds = [];
        
        // 加载出版社数据
        async function loadPublishers() {
            try {
                const response = await fetch('publishers_with_pages.json');
                publishers = await response.json();
                publisherIds = Object.keys(publishers);
                
                document.getElementById('stats').textContent = 
                    `共加载 ${publisherIds.length} 家出版社数据`;
                
                // 注释掉自动生成，只在用户点击按钮时生成
                // generateRandomPage();
            } catch (error) {
                console.error('加载出版社数据失败:', error);
                document.getElementById('stats').textContent = 
                    '加载数据失败，请检查文件是否存在';
            }
        }
        
        // 更新范围值显示，实现动态步长
        function updateRangeValue(slider) {
            let value = parseInt(slider.value);
            
            // 实现动态步长：1-10%使用1%步长，10%以上使用5%步长
            if (value > 10) {
                // 对于大于10%的值，调整为5的倍数
                value = Math.round(value / 5) * 5;
                slider.value = value;
            }
            
            document.getElementById('rangeValue').textContent = value;
        }
        
        // 生成随机页面
        function generateRandomPage() {
            if (publisherIds.length === 0) {
                alert('数据尚未加载完成，请稍候');
                return;
            }
            
            // 获取当前设置的百分比
            const rangePercentage = parseInt(document.getElementById('rangeValue').textContent);
            
            // 随机选择一个出版社
            const randomPublisherId = publisherIds[Math.floor(Math.random() * publisherIds.length)];
            const publisher = publishers[randomPublisherId];
            
            // 根据百分比计算最大页数限制
            const maxPageLimit = Math.ceil(publisher.total_pages * (rangePercentage / 100));
            
            // 随机选择一个有效页数（不超过计算出的最大限制）
            const randomPage = Math.floor(Math.random() * maxPageLimit) + 1;
            
            // 构建访问链接
            const baseUrl = publisher.url.replace(/\/$/, '');
            const visitUrl = `${baseUrl}?page=${randomPage}`;
            
            // 跳转到随机页面
            window.open(visitUrl, '_blank');
        }
        
        // 页面加载完成后加载数据
        window.addEventListener('DOMContentLoaded', loadPublishers);


    </script>
</body>
</html>
